model:
  model_name: mixtral

system:
  gpu_gen: H100
  num_node: 1
  num_device: 4
  processor_type: GPU
  offload:
    collects_gpu_compute: on
    offload_expert_to_cpu_memory: off
    offload_expert_to_ssd: off
    ssd_energy_scale: 1.0
    offload_bandwidth: 5 # GPU <-> CPU-memory/SSD NVLink-C2C generation 4: NVLink4.0 and 5: NVLink5.0
  distribution:
    expert_tensor_degree: 1
    none_expert_tensor_degree: 4
  optimization:
    compressed_kv: off
    use_absorb: off
    prefill_mode: off
    decode_mode: on

serving:
  max_batch_size: 1
  max_process_token: 0

simulation:
  data: synthesis
  input_len: 1024
  output_len: 2
  precision_byte: 2
  iter: 2
  injection_rate: 0

log:
  output_directory: ./tmp
