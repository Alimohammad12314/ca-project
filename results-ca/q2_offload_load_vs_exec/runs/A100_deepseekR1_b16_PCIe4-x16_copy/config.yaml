model:
  model_name: deepseekR1
system:
  gpu_gen: A100
  num_node: 1
  num_device: 1
  processor_type: GPU
  offload:
    collects_gpu_compute: false
    offload_expert_to_cpu_memory: true
    offload_expert_to_ssd: false
    ssd_energy_scale: 1.0
    offload_bandwidth: 5
    offload_bandwidth_GBps: 32.0
  distribution:
    expert_tensor_degree: 1
    none_expert_tensor_degree: 1
  optimization:
    compressed_kv: true
    use_absorb: true
    prefill_mode: false
    decode_mode: true
serving:
  max_batch_size: 16
  max_process_token: 0
simulation:
  data: synthesis
  input_len: 1024
  output_len: 2
  precision_byte: 2
  iter: 2
  injection_rate: 0
  routing:
    model: uniform
log:
  output_directory: ./out
_meta:
  gpu: A100
  model: deepseekR1
  batch: 16
  mode: copy
  link_GBps: 32.0
